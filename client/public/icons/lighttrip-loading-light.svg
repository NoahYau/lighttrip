<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="ltGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .lt-sweep { transform-box: view-box; transform-origin: 48px 52px; animation: lt-sweep 2.4s cubic-bezier(.57,.06,.43,.94) infinite; }
    .lt-pulse { transform-box: view-box; transform-origin: 48px 52px; animation: lt-pulse 2.4s ease-in-out infinite; }
    .lt-glow  { transform-box: view-box; transform-origin: 48px 52px; animation: lt-glow 2.4s ease-in-out infinite; }
    @keyframes lt-sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes lt-pulse { 0%, 100% { transform: scale(.9); opacity: .75; } 50% { transform: scale(1.12); opacity: 1; } }
    @keyframes lt-glow  { 0%, 100% { transform: scale(.7); opacity: .35; } 50% { transform: scale(1.25); opacity: .7; } }
    @media (prefers-reduced-motion: reduce) {
      .lt-sweep, .lt-pulse, .lt-glow { animation: none; }
    }
  </style>
  <circle class="lt-glow" cx="48" cy="52" r="16" fill="url(#ltGlow)"/>
  <circle cx="50" cy="50" r="31" fill="none" stroke="#0F766E" stroke-width="7"/>
  <g class="lt-sweep">
    <g transform="translate(48 52)">
      <path d="M0 0 C-9 -12.5 -10.2 -27.5 0 -44 C10.2 -27.5 9 -12.5 0 0 Z" fill="#2FB680" transform="rotate(45)"/>
    </g>
  </g>
  <circle class="lt-pulse" cx="48" cy="52" r="4.8" fill="#F59E0B"/>
</svg>
